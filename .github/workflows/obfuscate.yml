name: Obfuscate src.py to main.py

on:
  push:
    branches:
      - main
    paths:
      - "src.py"
      - "scripts/obfuscate.py"
      - ".github/workflows/obfuscate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obfuscate-main
  cancel-in-progress: true

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Obfuscate src.py to main.py
        run: python3 scripts/obfuscate.py

      - name: Commit and push main.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          if git diff --staged --quiet; then
            echo "No changes to main.py, skipping commit"
          else
            git commit -m "chore: obfuscate src.py -> main.py [skip ci]"
            git push
          fi
